name: relay-backup
# Backup for the local relay loop: refresh luria.json every 5 minutes on election night.
on:
  schedule:
    - cron: "*/5 23 3 11 *"
    - cron: "*/5 0-8 4 11 *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: relay
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fetch VA-2 results
        run: python3 relay.py luria.json
      - name: Push snapshot
        run: |
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git add luria.json
          git commit -q -m "chore(data): backup snapshot $(date -u +%H:%M)" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && exit 0; sleep 5; done
          exit 1
